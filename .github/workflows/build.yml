name: Build & Release

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
      - '[0-9]+.*'
  release:
    types: [ published ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact_name: MiffBuggPy-Windows-x64
            cmake_args: ''
            build_args: '--config Release'
            is_windows: true
          - name: macOS
            os: macos-latest
            artifact_name: MiffBuggPy-macOS-Universal
            cmake_args: '-DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"'
            build_args: '--config Release'
            is_macos: true
          - name: Linux
            os: ubuntu-latest
            artifact_name: MiffBuggPy-Linux-x64
            cmake_args: '-DCMAKE_BUILD_TYPE=Release'
            build_args: '--config Release'
            is_linux: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: matrix.is_linux
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libjack-jackd2-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxinerama-dev \
            libxext-dev \
            libfreetype6-dev \
            libxcursor-dev

      - name: Configure CMake
        run: cmake -B build -S . ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build ${{ matrix.build_args }} --parallel

      - name: Stage Artifacts (Windows)
        if: matrix.is_windows
        shell: bash
        run: |
          mkdir -p staging
          cp -r dist/* staging/
          cd staging && 7z a ../${{ matrix.artifact_name }}.zip *

      - name: Stage Artifacts (macOS)
        if: matrix.is_macos
        shell: bash
        run: |
          mkdir -p staging
          cp -r build/MiffBuggPy_artefacts/Release/VST3/MiffBuggPy.vst3 staging/ || true
          cp -r build/MiffBuggPy_artefacts/Release/AU/MiffBuggPy.component staging/ || true
          cp -r build/MiffBuggPy_artefacts/Release/Standalone/MiffBuggPy.app staging/ || true
          cp packaging/README.txt staging/ || true
          cd staging && zip -r -y ../${{ matrix.artifact_name }}.zip *

      - name: Stage Artifacts (Linux)
        if: matrix.is_linux
        shell: bash
        run: |
          mkdir -p staging
          cp -r build/MiffBuggPy_artefacts/Release/VST3/MiffBuggPy.vst3 staging/ || true
          cp build/MiffBuggPy_artefacts/Release/Standalone/MiffBuggPy staging/ || true
          cp packaging/README.txt staging/ || true
          cd staging && zip -r ../${{ matrix.artifact_name }}.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
